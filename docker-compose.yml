services:
    nginx:
        image: nginx:alpine
        container_name: edo_nginx
        ports:
            - "8082:8082"
        volumes:
            - .:/var/www/edo
            - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
            - onlyoffice
        networks:
            - edo_network

    php:
        build:
            context: ./php
            dockerfile: Dockerfile
        container_name: edo_php
        volumes:
            - .:/var/www/edo
        working_dir: /var/www/edo
        networks:
            - edo_network

    postgres:
        image: postgres:15
        container_name: edo_postgres
        environment:
            POSTGRES_USER: edo_user
            POSTGRES_PASSWORD: edo_pass
            POSTGRES_DB: edo_db
        volumes:
            - edo_pgdata:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        networks:
            - edo_network

    onlyoffice:
        image: onlyoffice/documentserver:latest
        container_name: edo_onlyoffice
        restart: always
        ports:
            - "8083:80"
            - "18443:443"
        environment:
            - JWT_ENABLED=true
            - JWT_SECRET=Oh5G3aU39Lw7YVnoPCqzmqMt2Tnzpzx1
            - JWT_HEADER=Authorization
            - JWT_IN_BODY=true
            - LOG_LEVEL=debug
        volumes:
            - onlyoffice-data:/var/www/onlyoffice/Data
            - onlyoffice-logs:/var/log/onlyoffice
        stdin_open: true
        tty: true
        networks:
            - edo_network

    ftp:
        image: fauria/vsftpd
        container_name: edo_ftp
        environment:
            - FTP_USER=user
            - FTP_PASS=pass
            - PASV_ENABLE=YES
            - PASV_MIN_PORT=30000
            - PASV_MAX_PORT=30010
            - PASV_ADDRESS=ftp
        volumes:
            - ./storage:/home/vsftpd
        networks:
            - edo_network

volumes:
    edo_pgdata:
    onlyoffice-data:
    onlyoffice-logs:
    edo_storage:
    edo_cache:

networks:
    edo_network:
        name: edo_network
        driver: bridge
