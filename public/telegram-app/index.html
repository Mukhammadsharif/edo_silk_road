<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdoLine</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        if (!window.Telegram) {
            window.Telegram = {
                WebApp: {
                    ready: function(){}, expand: function(){}, close: function(){},
                    initData: '', openLink: function(url){ window.open(url,'_blank'); }
                }
            };
        }
    </script>
    <style>
        :root {
            --bg: #f0f2f5; --card: #fff; --primary: #007AFF;
            --text: #1a1a1a; --sub: #888; --border: #f0f0f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* Header */
        .header { background: var(--primary); color: #fff; padding: 14px 16px 18px; position: sticky; top: 0; z-index: 10; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .header-logo { font-size: 17px; font-weight: 700; }
        .header-sub { font-size: 12px; opacity: 0.8; }
        .badge-count { background: rgba(255,255,255,0.25); border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 600; }

        /* States */
        .state { display: none; }
        .state.active { display: block; }

        /* Loader */
        .loader { text-align: center; padding: 60px 20px; color: var(--sub); }
        .spinner { width: 36px; height: 36px; border: 3px solid #e0e0e0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty */
        .empty { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-text { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .empty-sub { font-size: 13px; color: var(--sub); }

        /* Doc list */
        .doc-list { padding: 10px 12px 80px; }

        .doc-card {
            background: var(--card); border-radius: 14px; padding: 14px;
            margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }
        .doc-card:active { transform: scale(0.98); }

        .doc-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .doc-name { font-size: 14px; font-weight: 600; flex: 1; padding-right: 8px; line-height: 1.4; }
        .doc-arrow { color: var(--sub); font-size: 18px; }

        .doc-meta { display: flex; gap: 6px; flex-wrap: wrap; }
        .meta-tag { font-size: 11px; color: var(--sub); background: #f5f5f5; border-radius: 6px; padding: 3px 8px; }

        /* Role badges */
        .role-badge { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 3px 8px; }
        .role-SIGN  { background: #e3f2fd; color: #1565c0; }
        .role-RESOL { background: #f3e5f5; color: #6a1b9a; }
        .role-AGREE { background: #e8f5e9; color: #2e7d32; }

        /* Detail */
        .detail-top {
            background: var(--card); padding: 16px;
            border-radius: 0 0 16px 16px;
            margin-bottom: 10px;
        }
        .back-btn { display: flex; align-items: center; gap: 6px; color: var(--primary); font-size: 14px; cursor: pointer; margin-bottom: 14px; }
        .detail-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
        .detail-number { font-size: 13px; color: var(--sub); margin-bottom: 10px; }

        .detail-section { background: var(--card); border-radius: 14px; padding: 14px; margin: 0 12px 10px; }
        .detail-section-title { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

        /* Document body in detail */
        .doc-body-content {
            font-size: 13px; line-height: 1.7; color: #333;
            max-height: 250px; overflow-y: auto;
            border: 1px solid #f0f0f0; border-radius: 8px;
            padding: 10px;
        }
        .doc-body-content img { max-width: 100%; }

        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-row-label { color: var(--sub); }
        .detail-row-value { font-weight: 500; text-align: right; max-width: 60%; }

        /* Sign button */
        .sign-btn-wrap {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 10px 16px 18px;
            background: linear-gradient(to top, var(--bg) 70%, transparent);
        }
        .btn-sign {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #007AFF, #0056CC);
            color: #fff; border: none; border-radius: 14px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,122,255,0.3);
        }
        .btn-sign:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

        /* Error */
        .error-card { background: #fff5f5; border: 1px solid #ffcdd2; border-radius: 14px; padding: 20px; margin: 16px; text-align: center; }
        .error-icon { font-size: 32px; margin-bottom: 10px; }
        .error-text { font-size: 14px; color: #c62828; }
        .btn-retry { margin-top: 14px; padding: 10px 24px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }

        .file-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .file-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-row">
        <div class="header-logo">📄 EdoLine</div>
        <span class="badge-count" id="doc-count" style="display:none"></span>
    </div>
    <div class="header-sub" id="header-sub">Yuklanmoqda...</div>
</div>

<!-- Loading -->
<div class="state active" id="state-loading">
    <div class="loader"><div class="spinner"></div><div>Hujjatlar yuklanmoqda...</div></div>
</div>

<!-- Error -->
<div class="state" id="state-error">
    <div class="error-card">
        <div class="error-icon">⚠️</div>
        <div class="error-text" id="error-msg">Xatolik yuz berdi</div>
        <button class="btn-retry" onclick="init()">Qayta urinish</button>
    </div>
</div>

<!-- Not linked -->
<div class="state" id="state-not-linked">
    <div class="empty">
        <div class="empty-icon">🔗</div>
        <div class="empty-text">Akkaunt bog'lanmagan</div>
        <div class="empty-sub">Botga /start yuboring va email manzilingizni kiriting</div>
    </div>
</div>

<!-- Empty -->
<div class="state" id="state-empty">
    <div class="empty">
        <div class="empty-icon">✅</div>
        <div class="empty-text">Imzolash uchun hujjat yo'q</div>
        <div class="empty-sub">Barcha hujjatlar imzolangan</div>
    </div>
</div>

<!-- List -->
<div class="state" id="state-list">
    <div class="doc-list" id="doc-list"></div>
</div>

<!-- Detail -->
<div class="state" id="state-detail">
    <div class="detail-top">
        <div class="back-btn" onclick="showList()">← Orqaga</div>
        <div class="detail-title" id="detail-name"></div>
        <div class="detail-number" id="detail-number"></div>
        <span class="role-badge" id="detail-role-badge"></span>
    </div>

    <div class="detail-section">
        <div class="detail-section-title">Ma'lumotlar</div>
        <div class="detail-row">
            <span class="detail-row-label">Sana</span>
            <span class="detail-row-value" id="detail-date"></span>
        </div>
        <div class="detail-row">
            <span class="detail-row-label">Amal</span>
            <span class="detail-row-value" id="detail-action"></span>
        </div>
    </div>

    <!-- Document body -->
    <div class="detail-section" id="doc-body-section" style="display:none">
        <div class="detail-section-title">📄 Hujjat matni</div>
        <div class="doc-body-content" id="doc-body-content"></div>
    </div>

    <!-- Files -->
    <div class="detail-section" id="files-section" style="display:none">
        <div class="detail-section-title">📎 Fayllar</div>
        <div id="files-list"></div>
    </div>

    <div class="sign-btn-wrap">
        <button class="btn-sign" id="btn-sign-main" onclick="openSignPage()">
            ✍️ E-IMZO ID-CARD bilan imzolash
        </button>
    </div>
</div>

<script>
    var tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    var BASE_URL   = 'https://edoline.uz';
    var AUTH_TOKEN = null;
    var currentDoc = null;

    function setState(name) {
        document.querySelectorAll('.state').forEach(function(el) { el.classList.remove('active'); });
        var el = document.getElementById('state-' + name);
        if (el) el.classList.add('active');
    }

    async function init() {
        setState('loading');
        try {
            var initData = tg.initData;
            if (!initData) {
                document.getElementById('error-msg').textContent =
                    'Bu sahifa faqat Telegram ichida ishlaydi.';
                setState('error');
                return;
            }

            var authResp = await fetch(BASE_URL + '/api/telegram/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({init_data: initData})
            });
            var authData = await authResp.json();

            if (!authResp.ok) {
                if (authData.error === 'not_linked') { setState('not-linked'); return; }
                throw new Error(authData.message || 'Auth xatosi');
            }

            AUTH_TOKEN = authData.token;
            document.getElementById('header-sub').textContent =
                authData.user.name + ' — Imzolash uchun hujjatlar';

            await loadDocuments();
        } catch(e) {
            document.getElementById('error-msg').textContent = e.message || 'Ulanishda xatolik';
            setState('error');
        }
    }

    async function loadDocuments() {
        var resp = await fetch(BASE_URL + '/api/telegram/documents', {
            headers: {'Authorization': 'Bearer ' + AUTH_TOKEN}
        });
        if (!resp.ok) throw new Error('Hujjatlar yuklanmadi');
        var data = await resp.json();
        var docs = data.documents || [];

        if (!docs.length) { setState('empty'); return; }

        var cnt = document.getElementById('doc-count');
        cnt.textContent = docs.length;
        cnt.style.display = 'inline-block';

        renderList(docs);
        setState('list');
    }

    function roleClass(role) {
        if (role === 'RESOL') return 'role-RESOL';
        if (role === 'AGREE') return 'role-AGREE';
        return 'role-SIGN';
    }

    function renderList(docs) {
        var html = '';
        docs.forEach(function(doc) {
            html += '<div class="doc-card" onclick="openDoc(' + doc.id + ')">' +
                '<div class="doc-card-top">' +
                '<div class="doc-name">' + esc(doc.doc_name) + '</div>' +
                '<div class="doc-arrow">›</div>' +
                '</div>' +
                '<div class="doc-meta">' +
                (doc.doc_number ? '<span class="meta-tag">№' + esc(doc.doc_number) + '</span>' : '') +
                '<span class="meta-tag">' + esc(doc.created_at) + '</span>' +
                '<span class="role-badge ' + roleClass(doc.role) + '">' + esc(doc.role_label) + '</span>' +
                '</div>' +
                '</div>';
        });
        document.getElementById('doc-list').innerHTML = html;
    }

    async function openDoc(docId) {
        setState('loading');
        try {
            var resp = await fetch(BASE_URL + '/api/telegram/documents/' + docId, {
                headers: {'Authorization': 'Bearer ' + AUTH_TOKEN}
            });
            if (!resp.ok) throw new Error('Hujjat topilmadi');
            var doc = await resp.json();
            currentDoc = doc;

            document.getElementById('detail-name').textContent    = doc.doc_name || '—';
            document.getElementById('detail-number').textContent  = doc.doc_number ? '№ ' + doc.doc_number : '';
            document.getElementById('detail-date').textContent    = doc.created_at || '—';
            document.getElementById('detail-action').textContent  = doc.role_label || '—';

            var badge = document.getElementById('detail-role-badge');
            badge.textContent  = doc.role_label;
            badge.className    = 'role-badge ' + roleClass(doc.role);

            // HTML тело документа
            var bodySection = document.getElementById('doc-body-section');
            if (doc.html_doc) {
                document.getElementById('doc-body-content').innerHTML = doc.html_doc;
                bodySection.style.display = 'block';
            } else {
                bodySection.style.display = 'none';
            }

            // Файлы
            var filesSection = document.getElementById('files-section');
            if (doc.files && doc.files.length) {
                var fHtml = '';
                doc.files.forEach(function(f) {
                    fHtml += '<div class="file-row"><span>📎</span><span>' + esc(f.name) + '</span></div>';
                });
                document.getElementById('files-list').innerHTML = fHtml;
                filesSection.style.display = 'block';
            } else {
                filesSection.style.display = 'none';
            }

            setState('detail');
        } catch(e) {
            document.getElementById('error-msg').textContent = e.message;
            setState('error');
        }
    }

    function showList() { currentDoc = null; setState('list'); }

    async function openSignPage() {
        if (!currentDoc) return;
        var btn = document.getElementById('btn-sign-main');
        btn.disabled = true;
        btn.textContent = 'Yuklanmoqda...';

        try {
            var resp = await fetch(BASE_URL + '/api/telegram/documents/' + currentDoc.id + '/sign-token', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AUTH_TOKEN},
                body: JSON.stringify({})
            });
            var data = await resp.json();
            if (!resp.ok || !data.sign_url) throw new Error(data.error || 'Sign URL olinmadi');

            // Открывать в том же окне — не Safari
            window.location.href = data.sign_url;
        } catch(e) {
            alert('Xatolik: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = '✍️ E-IMZO ID-CARD bilan imzolash';
        }
    }

    function esc(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    init();
</script>
</body>
</html>
